<!doctype html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Hazard Lab · 7 categorías</title><style>
:root{--bg:#f4f7f8;--ink:#16252b;--muted:#60747c;--card:#fff;--red:#d82f3f;--teal:#087f8c;--yellow:#ffd166;--shadow:0 12px 32px #18343d18}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#eef7f6,#f9f4ea);color:var(--ink)}header{padding:42px 20px 28px;text-align:center;background:#102f36;color:white}header b{color:#8ce1d8}h1{font-size:clamp(2rem,5vw,4rem);margin:.2rem}header p{max-width:750px;margin:10px auto;color:#d4e6e7}.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px auto 0}.tabs button,.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer}.tabs button{background:#fff1;color:#fff}.tabs button.active{background:#fff;color:#12333a}.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat{background:#fff;padding:18px;border-radius:18px;box-shadow:var(--shadow);text-align:center}.stat strong{font-size:1.7rem;color:var(--teal)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);border-top:6px solid var(--red);transition:.2s}.card:hover{transform:translateY(-4px)}.top{display:flex;align-items:center;gap:14px}.diamond{width:62px;height:62px;border:5px solid var(--red);transform:rotate(45deg);display:grid;place-items:center;background:#fff;flex:0 0 auto}.diamond span{transform:rotate(-45deg);font-size:28px}.card h2{font-size:1.05rem;margin:0}.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;font-weight:900;letter-spacing:.08em}.examples{margin-top:18px;display:grid;gap:10px}.ex{background:#f5f8f8;border-radius:14px;padding:12px}.formula{font-size:1.1rem;font-weight:900;color:#9d2030}.use{font-size:.87rem;color:var(--muted);margin-top:4px}.cop{border-top-color:#5b467f}.cop .diamond{border-color:#5b467f}.learnNote{background:#fff6d9;border-left:5px solid #e7ad16;padding:14px;border-radius:12px;margin-top:12px}.quiz{display:none;max-width:760px;margin:auto}.qbox{background:white;border-radius:24px;padding:28px;box-shadow:var(--shadow)}.qnum{color:var(--teal);font-weight:900}.question{font-size:1.45rem;font-weight:900;margin:12px 0 20px}.options{display:grid;gap:10px}.option{border:2px solid #dce6e8;background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:750;cursor:pointer}.option:hover{border-color:var(--teal)}.option.ok{background:#dff7e8;border-color:#3c9b62}.option.bad{background:#ffe2e4;border-color:#d82f3f}.feedback{min-height:28px;margin:14px 0;font-weight:800}.btn{background:#123e47;color:white}.btn:disabled{opacity:.4}.flash{display:none}.flashGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.flip{height:210px;perspective:900px;cursor:pointer}.flipin{position:relative;width:100%;height:100%;transition:.55s;transform-style:preserve-3d}.flip.flipped .flipin{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border-radius:22px;box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;padding:20px}.back{transform:rotateY(180deg);background:#123e47;color:#fff}.face .big{font-size:2rem;font-weight:900}.small{font-size:.85rem;color:var(--muted)}.back .small{color:#cce0e2}@media(max-width:600px){.stats{grid-template-columns:1fr}.wrap{padding:18px 12px 40px}.card{padding:16px}}
</style></head><body><header><div class='tag' style='color:#8ce1d8'>MICROCURSO INTERACTIVO</div><h1>Hazard <b>Lab</b></h1><p>Aprende, repasa y practica las 7 categorías y sus ejemplos. El contenido se limita a los datos proporcionados.</p><div class='tabs'><button class='active' data-view='learn'>Aprender</button><button data-view='flash'>Repasar</button><button data-view='quiz'>Practicar</button></div></header><main class='wrap'><section id='learn'><div class='stats'><div class='stat'><strong>7</strong><br>Categorías</div><div class='stat'><strong>14</strong><br>ejemplos / referencias</div><div class='stat'><strong>3</strong><br>modos de estudio</div></div><div id='cards' class='grid'></div></section><section id='flash' class='flash'><p style='text-align:center;color:var(--muted)'>Pulsa una tarjeta para descubrir la categoría y el uso.</p><div id='flashGrid' class='flashGrid'></div></section><section id='quiz' class='quiz'><div class='qbox'><div id='qnum' class='qnum'></div><div id='question' class='question'></div><div id='options' class='options'></div><div id='feedback' class='feedback'></div><button id='next' class='btn' disabled>Siguiente →</button></div></section></main><script>
const cats=[
{name:'COMBURENTE',pic:'⭕🔥',items:[['H₂O₂','Peróxido de hidrógeno','Blanqueante / desinfectante de superficies'],['HNO₃','Ácido nítrico','Fertilizante / fabricación de fertilizantes nitrogenados']]},
{name:'INFLAMABLE',pic:'🔥',items:[['C₃H₆O','Acetona','Materia prima para plástico y resina / disolvente'],['C₂H₆O','Etanol','Aditivo para gasolina / combustible / antiséptico']]},
{name:'CORROSIVO',pic:'🧪✋',items:[['CH₃COOH','Ácido acético','Industria del plástico / conservante E260'],['HCl','Ácido clorhídrico','Desinfectante / limpieza de metales']]},
{name:'SENSIBILIZANTE',pic:'❗',items:[['C₈H₁₀','Xileno / Tolueno','Pinturas y barnices / adhesivos y tintas'],['NH₄Cl','Cloruro de amonio','Fertilizante / fundente en soldadura']]},
{name:'TÓXICO',pic:'☠️',items:[['NaCN','Cianuro de sodio','Minería (extracción de oro) / tratamiento metalúrgico'],['C₆H₅Cl','Cloruro de benceno','Producción de pesticidas / síntesis orgánica']]},
{name:'PELIGROSO PARA EL MEDIO AMBIENTE',pic:'🌳🐟',items:[['Hg','Mercurio','Termómetros / lámparas de descarga'],['—','Microplásticos','Aditivo en cosméticos / contaminante en tejidos sintéticos']]},
{name:'COP · CONTAMINANTES ORGÁNICOS PERSISTENTES',pic:'🌳🐟👤',cop:true,items:[['DDT','Pesticida prohibido','Persistente, bioacumulable y tóxico'],['Dioxinas','Subproducto de combustión','Persistente, bioacumulable y tóxico']]}
];
const cards=document.querySelector('#cards');cats.forEach(c=>{cards.innerHTML+=`<article class='card ${c.cop?'cop':''}'><div class='top'><div class='diamond'><span>${c.pic}</span></div><div><div class='tag'>Categoría</div><h2>${c.name}</h2></div></div><div class='examples'>${c.items.map(i=>`<div class='ex'><div><span class='formula'>${i[0]}</span> · <b>${i[1]}</b></div><div class='use'>Uso / característica: ${i[2]}</div></div>`).join('')}</div>${c.cop?`<div class='learnNote'><b>COP:</b> persistente, bioacumulable y tóxico · Convenio de Estocolmo.</div>`:''}</article>`});
const fg=document.querySelector('#flashGrid');cats.flatMap(c=>c.items.map(i=>({...c,item:i}))).forEach(x=>fg.innerHTML+=`<div class='flip' onclick='this.classList.toggle("flipped")'><div class='flipin'><div class='face'><div><div class='big'>${x.item[0]}</div><b>${x.item[1]}</b><div class='small'>Pulsa para revelar</div></div></div><div class='face back'><div><div class='big'>${x.pic}</div><b>${x.name}</b><div class='small'>${x.item[2]}</div></div></div></div></div>`);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['learn','flash','quiz'].forEach(v=>document.querySelector('#'+v).style.display=v===b.dataset.view?(v==='quiz'?'block':v==='flash'?'block':'block'):'none');if(b.dataset.view==='quiz')startQuiz()});
let qs=[],qi=0,score=0,answered=false;function startQuiz(){qs=cats.flatMap(c=>c.items.map(i=>({q:`¿A qué categoría pertenece ${i[1]} (${i[0]})?`,a:c.name}))).sort(()=>Math.random()-.5).slice(0,10);qi=0;score=0;renderQ()}function renderQ(){answered=false;const q=qs[qi];document.querySelector('#qnum').textContent=`Pregunta ${qi+1} de ${qs.length} · Puntos: ${score}`;document.querySelector('#question').textContent=q.q;let opts=[q.a,...cats.map(c=>c.name).filter(n=>n!==q.a).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);document.querySelector('#options').innerHTML=opts.map(o=>`<button class='option'>${o}</button>`).join('');document.querySelector('#feedback').textContent='';document.querySelector('#next').disabled=true;document.querySelectorAll('.option').forEach(o=>o.onclick=()=>{if(answered)return;answered=true;const ok=o.textContent===q.a;if(ok){score++;o.classList.add('ok');document.querySelector('#feedback').textContent='✓ Correcto';}else{o.classList.add('bad');[...document.querySelectorAll('.option')].find(x=>x.textContent===q.a).classList.add('ok');document.querySelector('#feedback').textContent='La respuesta correcta es: '+q.a;}document.querySelector('#next').disabled=false})}document.querySelector('#next').onclick=()=>{qi++;if(qi>=qs.length){document.querySelector('.qbox').innerHTML=`<div class='qnum'>Reto completado</div><div class='question'>${score} / ${qs.length} respuestas correctas</div><p>Vuelve a “Practicar” para generar una nueva ronda aleatoria.</p>`}else renderQ()};
</script></body></html>
